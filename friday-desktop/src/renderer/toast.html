<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friday Toast Mini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: rgba(18, 18, 24, 0.92);
      border: 1px solid #7c3aed;
      border-radius: 12px;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      padding: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      -webkit-app-region: drag;
    }
    .toast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .toast-title {
      font-size: 13px;
      font-weight: 700;
      color: #a78bfa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-expand {
      background: #7c3aed;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      -webkit-app-region: no-drag;
      transition: background 0.2s;
    }
    .btn-expand:hover { background: #6d28d9; }
    .toast-body {
      font-size: 12px;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mic-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="toast-header">
    <div class="toast-title">⚡ FRIDAY ASSISTANT</div>
    <button class="btn-expand" id="btnExpand">🗖 Full App</button>
  </div>
  <div class="toast-body">
    <div class="mic-dot"></div>
    <span id="toastStatus">Listening for "Hey Friday"...</span>
  </div>

  <script>
    document.getElementById('btnExpand').addEventListener('click', () => {
      window.fridayAPI.toggleMiniMode(false);
    });
  </script>
</body>
</html>

name: Build Friday Apps (Desktop & Android)

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Friday Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd friday-desktop
          npm install

      - name: Run Tests
        run: |
          cd friday-desktop
          npm test

      - name: Build Electron Packages
        run: |
          cd friday-desktop
          if [ "${{ runner.os }}" = "Linux" ]; then
            npm run package:linux
          elif [ "${{ runner.os }}" = "Windows" ]; then
            npm run package:win
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run package:mac
          fi
        shell: bash

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: friday-desktop-${{ matrix.os }}
          path: friday-desktop/dist/*

  build-android:
    name: Build Friday Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x friday-native/gradlew

      - name: Build Android Debug APK
        run: |
          cd friday-native
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-android-apk
          path: friday-native/app/build/outputs/apk/debug/app-debug.apk
